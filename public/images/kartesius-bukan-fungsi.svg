<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-label="Bidang koordinat Kartesius dengan titik (1,2), (1,5), (2,4), dan (3,6) sebagai contoh bukan fungsi">
